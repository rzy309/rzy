<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>响应式媒体查询布局</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			padding: 48px 24px;
			color: #202623;
			background: #f1f3ee;
			font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
		}

		main {
			width: min(1360px, 100%);
			margin: 0 auto;
		}

		header {
			display: flex;
			align-items: end;
			justify-content: space-between;
			gap: 20px;
			margin-bottom: 28px;
			padding-bottom: 18px;
			border-bottom: 2px solid #202623;
		}

		h1 {
			margin: 0;
			font-size: 32px;
			line-height: 1.2;
		}

		header p {
			margin: 0;
			color: #627069;
			font-size: 14px;
		}

		.grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 14px;
		}

		.box {
			min-width: 0;
			aspect-ratio: 1.15;
			display: flex;
			align-items: end;
			padding: 16px;
			color: #fff;
			font-size: 24px;
			font-weight: 700;
		}

		.box:nth-child(4n + 1) { background: #d65b46; }
		.box:nth-child(4n + 2) { background: #26766d; }
		.box:nth-child(4n + 3) { background: #d99a35; }
		.box:nth-child(4n) { background: #344b63; }

		@media (min-width: 320px) and (max-width: 599px) {
			body {
				padding: 32px 16px;
			}

			.grid {
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 12px;
			}
		}

		@media (min-width: 600px) {
			body {
				padding: 56px 32px;
			}

			.grid {
				grid-template-columns: repeat(4, minmax(0, 1fr));
				gap: 18px;
			}
		}

		@media (min-width: 1080px) {
			.grid {
				grid-template-columns: repeat(8, minmax(0, 1fr));
				gap: 14px;
			}
		}
	</style>
</head>
<body>
	<main>
		<header>
			<h1>荣子祎</h1>
			<p>MEDIA QUERY / GRID</p>
		</header>
		<section class="grid" aria-label="响应式盒子网格">
			<div class="box">01</div>
			<div class="box">02</div>
			<div class="box">03</div>
			<div class="box">04</div>
			<div class="box">05</div>
			<div class="box">06</div>
			<div class="box">07</div>
			<div class="box">08</div>
		</section>
	</main>
</body>
</html>
