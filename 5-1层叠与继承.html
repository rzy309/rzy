<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=2">
    <title>309 荣子祎</title>
    <!-- 后定义的样式会覆盖之前定义的样式 -->
    <link rel="stylesheet" href="css.css">
    <style>
        .text{
            color: violet!important;
            /* hack，优先级大于内嵌CSS */
        }
        #box p{
            color: silver;
        }
        .box p{
            color: purple;
        }
        #text{
            color: yellow;
        }
        .text{
            color: blue;
        }
        p{
            color: red;
            font-size: 60px;
        }
        /* 优先级：内联样式>id选择器>类选择器>标签选择器>继承样式 */
        /* body #box #text.text */
    </style>
    
</head>
<body>
    <h2>层叠与继承</h2>
    <div id = "box" class = "box">
        <p id = "text" class = "text">309 荣子祎</p>
        <p>CSS 选择器的优先级</p>
    </div>
    
</body>
</html>
