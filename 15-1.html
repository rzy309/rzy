<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15-1 数7游戏 - 荣子祎</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .rzy_container {
            max-width: 900px;
            margin: 0 auto;
        }

        .rzy_header {
            text-align: center;
            margin-bottom: 20px;
        }

        .rzy_title {
            font-size: 28px;
            font-weight: bold;
            color: #2d3436;
            margin-bottom: 8px;
        }

        .rzy_subtitle {
            font-size: 16px;
            color: #636e72;
        }

        .rzy_rule {
            text-align: center;
            background: #fff;
            border-radius: 10px;
            padding: 12px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            font-size: 14px;
            color: #2d3436;
        }

        .rzy_rule b {
            color: #d63031;
        }

        .rzy_grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
        }

        .rzy_box {
            width: 60px;
            height: 60px;
            border: 2px solid #0984e3;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #0984e3;
            background: #dfefff;
            transition: transform 0.2s;
            cursor: default;
        }

        .rzy_box:hover {
            transform: scale(1.08);
        }

        /* 满足规则的空盒子 */
        .rzy_box.rzy_empty {
            border: 2px dashed #d63031;
            background: #ffeaa7;
            color: transparent;
        }

        .rzy_footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #636e72;
        }

        .rzy_back {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 20px;
            background: #0984e3;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .rzy_back:hover {
            background: #0770c2;
        }
    </style>
</head>
<body>
    <div class="rzy_container">
        <div class="rzy_header">
            <h1 class="rzy_title">数7游戏</h1>
            <div class="rzy_subtitle">荣子祎 - 15-1</div>
        </div>

        <div class="rzy_rule">
            规则：从 1 到 100，<b>是 7 的倍数</b> 或 <b>末尾是 7</b> 的数字 → 空盒子（踩雷）
        </div>

        <div class="rzy_grid" id="rzy_grid"></div>

        <div class="rzy_footer">
            页面作者：荣子祎
            <br>
            <a href="index.html" class="rzy_back">返回首页</a>
        </div>
    </div>

    <script>
        // 数7规则判断函数
        function rzy_isBomb(num) {
            // 是 7 的倍数 或 末尾是 7
            return num % 7 === 0 || num % 10 === 7;
        }

        // 生成 100 个盒子
        var rzy_grid = document.getElementById('rzy_grid');
        var rzy_html = '';
        for (var i = 1; i <= 100; i++) {
            if (rzy_isBomb(i)) {
                rzy_html += '<div class="rzy_box rzy_empty"></div>';
            } else {
                rzy_html += '<div class="rzy_box">' + i + '</div>';
            }
        }
        rzy_grid.innerHTML = rzy_html;
    </script>
</body>
</html>
