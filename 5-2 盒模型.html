<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型,框模型,box model</title>
    <style>
        .a{
            width: 500px;
            height: 500px;
            border: 2px dotted #039;
            padding: 70px 60px 50px 40px;
            margin: 40px auto;
        }
        .b{
            width: 500px;
            height: 300px;
            border: 2px dashed red;
            margin: 50px auto;
            box-sizing: border-box;

        }

    </style>
</head>
<body>
    <div class="a">309荣子祎</div>
    <div class="b">309荣子祎</div>
    <div class="c">309荣子祎</div>
</body>
</html>
