<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>309荣子祎</title>
    <style>
        h2,h3,p{
            padding: 0;
            margin: 0;
        }/*群组选择器*/
        #box{
            padding: 8px;
            margin: 20px;
            border: 1px solid #ccc;
            font-size: 12px;
            width: 480px;
        }
        #box h3{
            /* 字体大小 16px */
            font-size: 16px;
            /* 行高33px */
            line-height: 33px;
            /* 居中 */
            text-align: center;
            /* 颜色 */
            color: #034;
            /* 字间距 */
            letter-spacing: 3px;
        }           
        #box p{
            /* 颜色 */
            color: #666;
            /* 首行缩进2em */
            text-indent: 2em;
            /* 行高150% */
            line-height: 150%;
        }
        #box a{
            /* 颜色 */
            color: #c00;
            /* 下划线 */
            text-decoration: none;
        }
        .bbb{
            color: blue;
            font-weight: bold;
        }
        /* ========== 新增扩展样式，原有代码全部保留 ========== */
        /*扩展2：h2黑底白字*/
        h2{
            background: #000;
            color: #fff;
            text-align: center;
            line-height: 150%;
        }
        /*扩展1：学号、姓名、班级蓝色加粗，使用bbb类选择器（题目要求只用1个选择器）*/
        /*扩展3：知识点蓝底白字*/
        .tip{
            background: blue;
            color: white;
        }
    </style>
</head>
<body>
    <h2>css群组选择器和后代选择器</h2>
    <div id="box">
        <h3>CSS进阶</h3>
        <p><span class="bbb">学号：309,姓名：荣子祎，班级：计算机24003</span>，《高级网页设计》的学习难度：中等，
            本实例的知识点：<span class="tip">css群组选择器和后代选择器</span>。
            <a href="#">【更多】</a>
        </p>
    </div>
    <!-- 1.扩展：学号，姓名，班级的值是蓝色加粗，使用1个css选择器
     2.h2黑底白字居中行高150%
     3.知识点的值蓝底白字 -->
</body>
</html>
